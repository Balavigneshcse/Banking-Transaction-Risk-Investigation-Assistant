<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#F8FAFC",
            "surface-default": "#FFFFFF",
            "surface-subtle": "#F1F5F9",
            "border-subtle": "#E2E8F0",
            "border-strong": "#CBD5E1",
            "brand-navy": "#0F172A",
            "text-primary": "#0F172A",
            "text-secondary": "#475569",
            "text-tertiary": "#94A3B8",
            "primary": "#2563EB",
            "primary-hover": "#1D4ED8",
            "risk-critical": "#DC2626",
            "risk-critical-bg": "#FEF2F2",
            "risk-critical-border": "#FECACA",
            "risk-warning": "#D97706",
            "risk-warning-bg": "#FFFBEB",
            "status-safe": "#16A34A",
            "status-safe-bg": "#F0FDF4",
          },
          fontFamily: {
            "display": ["Hanken Grotesk", "sans-serif"],
            "body": ["Inter", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"],
            "headline-sm": ["Hanken Grotesk", "sans-serif"],
            "title-md": ["Inter", "sans-serif"],
            "body-md": ["Inter", "sans-serif"],
            "mono-id": ["JetBrains Mono", "monospace"],
            "mono-data": ["JetBrains Mono", "monospace"],
            "label-md": ["Inter", "sans-serif"],
          }
        }
      }
    };
  </script>
  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
    }
  </style>
</head>
<body class="bg-surface font-body text-text-primary min-h-screen flex antialiased selection:bg-blue-100 selection:text-blue-900">
  
  <!-- Left Sidebar Navigation -->
  <aside class="print:hidden fixed left-0 top-0 h-full w-64 bg-surface-default border-r border-border-subtle z-50 flex flex-col justify-between">
    <div>
      <div class="h-16 px-6 flex items-center gap-3 border-b border-border-subtle">
        <div class="flex flex-col">
          <span class="font-display font-bold text-base text-brand-navy tracking-tight leading-none">SentinelRisk</span>
          <span class="font-mono text-[11px] text-text-tertiary mt-1">Core Investigation</span>
        </div>
      </div>
      <nav class="p-4 space-y-1" id="sidebar-nav">
        <a class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium text-sm text-text-secondary hover:bg-surface-subtle hover:text-text-primary transition-colors" href="#/investigation" data-path="investigation">
          <span class="material-symbols-outlined text-[19px]">find_in_page</span>
          <span>Investigation Case</span>
        </a>
        <a class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium text-sm text-text-secondary hover:bg-surface-subtle hover:text-text-primary transition-colors" href="#/baseline" data-path="baseline">
          <span class="material-symbols-outlined text-[19px]">insights</span>
          <span>Customer Baselines</span>
        </a>
        <a class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium text-sm text-text-secondary hover:bg-surface-subtle hover:text-text-primary transition-colors" href="#/config" data-path="config">
          <span class="material-symbols-outlined text-[19px]">rule</span>
          <span>Detection Rules</span>
        </a>
        <a class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium text-sm text-text-secondary hover:bg-surface-subtle hover:text-text-primary transition-colors" href="#/audit" data-path="audit">
          <span class="material-symbols-outlined text-[19px]">fact_check</span>
          <span>SAR &amp; Regulatory Audit</span>
        </a>
      </nav>
    </div>
    <div class="p-4 border-t border-border-subtle bg-surface-subtle/50">
      <div class="flex items-center justify-between">
        <div class="flex flex-col">
          <span class="font-mono text-xs text-text-secondary font-medium">Deterministic Core</span>
        </div>
        <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-status-safe-bg text-status-safe text-[11px] font-medium">
          <span class="w-1.5 h-1.5 rounded-full bg-status-safe"></span> Live Guard
        </span>
      </div>
    </div>
  </aside>

  <!-- Main Content Wrapper for SPA -->
  <div id="app-root" class="flex-1 flex flex-col min-w-0">
    <!-- View content will be injected here via app.js -->
  </div>

  <script src="app.js"></script>
</body>
</html>
